services:
  # ---------------------------------------------------------------------------
  # Database: PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: csp-lab-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-csplab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csplab_password}
      POSTGRES_DB: ${POSTGRES_DB:-csplab_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-csplab} -d $${POSTGRES_DB:-csplab_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Cache & Rate Limiter: Valkey
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:9.0.7-alpine3.24
    container_name: csp-lab-valkey
    restart: always
    command: valkey-server --appendonly no --requirepass ${VALKEY_PASSWORD:-valkey_password}
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:-valkey_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Web Application: Next.js 16 (CSP Lab Manager)
  # ---------------------------------------------------------------------------

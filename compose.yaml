  #   environment:
  #     NODE_ENV: production
  #     PORT: 3000
      
  #     # Database connection
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-csplab}:${POSTGRES_PASSWORD:-csplab_password}@postgres:5432/${POSTGRES_DB:-csplab_db}?schema=public
      
  #     REDIS_URL: redis://:${VALKEY_PASSWORD:-valkey_password}@valkey:6379
      
  #     # Better-Auth Configuration
  #     BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-super-secret-auth-key-change-me}
  #     BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      
  #     # Application Configuration
  #     NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
